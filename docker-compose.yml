services:
  st-gateway:
    build:
      context: ../st-gateway
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      SPACETRADERS_BASE_URL: https://api.spacetraders.io/v2

  mysql:
    container_name: vnm-agent-service-db
    restart: always
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: vnm-agent-db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - mysql_datavolume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexample"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: vnm-agent-db
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      ST_GATEWAY_URL: http://st-gateway:3002
    depends_on:
      mysql:
        condition: service_healthy
      st-gateway:
        condition: service_started

  navigation-service:
    build:
      context: ../navigation-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SQLITE_DB_PATH: /data/nav.db
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      ST_GATEWAY_URL: http://st-gateway:3002
    volumes:
      - nav_data:/data
    depends_on:
      - st-gateway

  fleet-service:
    build:
      context: ../fleet-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ST_GATEWAY_URL: http://st-gateway:3002
      AGENT_SERVICE_URL: http://agent-service:80/api/agent
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      - agent-service
      - st-gateway

volumes:
  mysql_datavolume:
  nav_data:
