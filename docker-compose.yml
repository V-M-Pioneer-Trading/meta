name: spacetraders

services:
  st-gateway:
    build:
      context: ../st-gateway
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      SPACETRADERS_BASE_URL: https://api.spacetraders.io/v2

  mysql:
    container_name: vnm-agent-service-db
    restart: always
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: vnm-agent-db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - mysql_datavolume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexample"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-service:
    build:
      context: ../agent-service
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: vnm-agent-db
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      ST_GATEWAY_URL: http://st-gateway:3002
      # Same local trust anchor as automation-service — see its comment below.
      CLERK_JWT_KEY_FILE: /run/dev-keys/dev-only-do-not-use.pub.pem
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
    volumes:
      - ./dev-keys:/run/dev-keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      st-gateway:
        condition: service_started

  navigation-service:
    build:
      context: ../navigation-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SQLITE_DB_PATH: /data/nav.db
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      ST_GATEWAY_URL: http://st-gateway:3002
      # Same local trust anchor as every other service — see automation-service.
      CLERK_JWT_KEY_FILE: /run/dev-keys/dev-only-do-not-use.pub.pem
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
    volumes:
      - nav_data:/data
      - ./dev-keys:/run/dev-keys:ro
    depends_on:
      - st-gateway

  fleet-service:
    build:
      context: ../fleet-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ST_GATEWAY_URL: http://st-gateway:3002
      AGENT_SERVICE_URL: http://agent-service:80/api/agent/v1
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      # Same local trust anchor as automation-service — see its comment below.
      CLERK_JWT_KEY_FILE: /run/dev-keys/dev-only-do-not-use.pub.pem
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
    volumes:
      - ./dev-keys:/run/dev-keys:ro
    depends_on:
      - agent-service
      - st-gateway

  automation-postgres:
    container_name: vnm-automation-service-db
    restart: always
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: automation
      POSTGRES_DB: automation
    volumes:
      - automation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  automation-service:
    build:
      context: ../automation-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:automation@automation-postgres:5432/automation
      NAVIGATION_SERVICE_URL: http://navigation-service:8080/api/navigation/v1
      AGENT_SERVICE_URL: http://agent-service:80/api/agent/v1
      FLEET_SERVICE_URL: http://fleet-service:3001/api/fleet/v1
      # No sensible default — set in a .env file next to this compose file
      # (see .env.example) or in the shell before `docker compose up`.
      MINING_SHIP_SYMBOL: ${MINING_SHIP_SYMBOL:-}
      ANOMALY_WEBHOOK_URL: http://ai-service:3004/webhooks/anomaly
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      # Local trust anchor: the committed development keypair (see
      # dev-keys/README.md), bind-mounted below so a fresh clone runs the real
      # verification path with no Clerk account. To drive the actual UI, set
      # CLERK_JWT_KEY in .env to a Clerk dev instance's public key — an inline
      # value wins over the file. There is no "auth off" mode.
      CLERK_JWT_KEY_FILE: /run/dev-keys/dev-only-do-not-use.pub.pem
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-local-dev-service-secret}
      # auth-design.md decision 19: this service is itself a caller of
      # agent/fleet-service, so it also needs to *sign* something, not just
      # verify — the private half of the same dev keypair, gated the same
      # way (inline CLERK_M2M_SECRET_KEY wins over the file, for pointing at
      # a real Clerk Machine without editing this file).
      DEV_M2M_SIGNING_KEY_FILE: /run/dev-keys/dev-only-do-not-use.key.pem
      CLERK_M2M_SECRET_KEY: ${CLERK_M2M_SECRET_KEY:-}
    volumes:
      - ./dev-keys:/run/dev-keys:ro
    depends_on:
      automation-postgres:
        condition: service_healthy
      agent-service:
        condition: service_started
      navigation-service:
        condition: service_started
      fleet-service:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      AUTOMATION_SERVICE_URL: http://automation-service:3003/api/automation/v1
      # No sensible default — set in a .env file next to this compose file
      # (see .env.example) or in the shell before `docker compose up`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - automation-service

volumes:
  mysql_datavolume:
  nav_data:
  auth_data:
  automation_postgres_data:
