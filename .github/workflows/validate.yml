name: validate

on:
  # No branch filter on `pull_request`: a PR stacked on another branch needs
  # the same checks as one targeting main. Filtering to main means a stacked
  # PR runs nothing at all and looks green by default.
  pull_request:
  push:
    branches: [main]

# Read-only for the whole workflow. Nothing here publishes, comments or
# writes; it reads one file and exits.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # is a movable pointer in someone else's repository, and `@v4` silently
      # becomes whatever they push to it. The comment records which release
      # the SHA was, so a reviewer can read the intent and a bump is a visible
      # diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the openapi-sync guard below can diff a pull
          # request against its merge base.
          fetch-depth: 0

      # There is no package.json here and there is not going to be one — the
      # validator is zero-dependency plain node for exactly that reason — so
      # no `cache: npm`, which needs a lockfile to key on, and no `npm ci`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Five implementations across three languages vendor
      # fixtures/introspection.json verbatim and compare it against a recorded
      # sha256. A structural mistake here is a mistake in all of them at once,
      # and the expensive kind is the silent one — a message that does not
      # match `contract.messages`, an identity that disagrees with the center
      # body it is derived from, an assertion key no suite knows. None of
      # those is something a conformance suite can catch about itself.
      - name: Validate the conformance fixtures
        run: node scripts/validate-fixtures.mjs

      # openapi-sync.yml is called @main by every backend's deploy workflow, so
      # a broken file here breaks their runs, and nothing else here parses it
      # (#111 nearly merged one that was not valid YAML). Release binary pinned
      # by version and sha256, like the actions above are pinned by SHA.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # openapi/*.json is merged automatically by the openapi-sync workflow (meta#26)
      # once this passes, so it is the only gate between a backend and this folder.
      # The openapi-sync App can write branches here and its pull requests
      # merge themselves, so a pull request it opens, or any on an
      # openapi-sync/ branch, may only add or modify one file: its own
      # service's spec. --no-renames, because a rename shows only its
      # destination under --name-only and would smuggle a deletion past this.
      # Matched by the App's own login, not "any bot": other Apps installed on
      # the org (claude) open ordinary pull requests here.
      - name: Restrict openapi-sync pull requests to their own spec
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'openapi-sync/') || github.event.pull_request.user.login == 'vmpt-openapi-sync[bot]')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in
            openapi-sync/*) ;;
            *) echo "::error::an openapi-sync pull request must come from an openapi-sync/<service> branch"; exit 1 ;;
          esac
          expected="openapi/${HEAD_REF#openapi-sync/}.json"
          changed=$(git diff --no-renames --name-status "$BASE_SHA...$HEAD_SHA")
          if [ "$changed" != "$(printf 'A\t%s' "$expected")" ] && [ "$changed" != "$(printf 'M\t%s' "$expected")" ]; then
            echo "::error::an openapi-sync pull request may only add or modify $expected; it changes:"
            echo "$changed"
            exit 1
          fi

      - name: Validate the OpenAPI specs
        run: node scripts/validate-openapi.mjs
