name: validate

on:
  # No branch filter on `pull_request`: a PR stacked on another branch needs
  # the same checks as one targeting main. Filtering to main means a stacked
  # PR runs nothing at all and looks green by default.
  pull_request:
  push:
    branches: [main]

# Read-only for the whole workflow. Nothing here publishes, comments or
# writes; it reads one file and exits.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag: a tag
      # is a movable pointer in someone else's repository, and `@v4` silently
      # becomes whatever they push to it. The comment records which release
      # the SHA was, so a reviewer can read the intent and a bump is a visible
      # diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the openapi-sync guard below can diff a pull
          # request against its merge base.
          fetch-depth: 0

      # There is no package.json here and there is not going to be one — the
      # validator is zero-dependency plain node for exactly that reason — so
      # no `cache: npm`, which needs a lockfile to key on, and no `npm ci`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Five implementations across three languages vendor
      # fixtures/introspection.json verbatim and compare it against a recorded
      # sha256. A structural mistake here is a mistake in all of them at once,
      # and the expensive kind is the silent one — a message that does not
      # match `contract.messages`, an identity that disagrees with the center
      # body it is derived from, an assertion key no suite knows. None of
      # those is something a conformance suite can catch about itself.
      - name: Validate the conformance fixtures
        run: node scripts/validate-fixtures.mjs

      # openapi/*.json is merged automatically by the openapi-sync workflow (meta#26)
      # once this passes, so it is the only gate between a backend and this folder.
      # The openapi-sync App can write branches here and its pull requests
      # merge themselves, so a pull request it opens (or any bot-authored one,
      # or any on an openapi-sync/ branch) may change exactly one file: its
      # own service's spec. Anything else fails, whatever the App's token is
      # used for. meta has no other bot today; one added later needs its own
      # exception here.
      - name: Restrict openapi-sync pull requests to their own spec
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'openapi-sync/') || github.event.pull_request.user.type == 'Bot')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in
            openapi-sync/*) ;;
            *) echo "::error::a bot-authored pull request must come from an openapi-sync/<service> branch"; exit 1 ;;
          esac
          expected="openapi/${HEAD_REF#openapi-sync/}.json"
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ "$changed" != "$expected" ]; then
            echo "::error::an openapi-sync pull request may change only $expected; it changes:"
            echo "$changed"
            exit 1
          fi

      - name: Validate the OpenAPI specs
        run: node scripts/validate-openapi.mjs
